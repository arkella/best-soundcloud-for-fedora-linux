<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link href="./styles.css" rel="stylesheet">
  <title>SoundCloud</title>
</head>

<body>
  <div class="titlebar">
    <!-- Left: Original SoundCloud Logo + Audio EQ Studio + Theme/Wallpaper Studio + Lyrics -->
    <div id="toolbar-left">
      <button id="sc-logo-btn" class="sc-logo-btn" title="Перезагрузить страницу SoundCloud" onclick="window.electronAPI.nav.home()">
        <!-- Official SoundCloud Vector Emblem -->
        <svg viewBox="0 0 48 24" width="38" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="12" width="2" height="8" rx="1" fill="var(--sc-accent, #FF5500)"/>
          <rect x="4.5" y="9" width="2" height="11" rx="1" fill="var(--sc-accent, #FF5500)"/>
          <rect x="8" y="11" width="2" height="9" rx="1" fill="var(--sc-accent, #FF5500)"/>
          <rect x="11.5" y="6" width="2" height="14" rx="1" fill="var(--sc-accent, #FF5500)"/>
          <rect x="15" y="4" width="2" height="16" rx="1" fill="var(--sc-accent, #FF5500)"/>
          <rect x="18.5" y="7" width="2" height="13" rx="1" fill="var(--sc-accent, #FF5500)"/>
          <rect x="22" y="3" width="2" height="17" rx="1" fill="var(--sc-accent, #FF5500)"/>
          <path d="M26 3.5C26.8 3.2 27.7 3 28.7 3C33.4 3 37.3 6.5 37.9 11.1C38.6 10.7 39.5 10.5 40.4 10.5C43.5 10.5 46 13 46 16.1C46 18.3 44.2 20 42 20H26.5C25.9 20 25.5 19.6 25.5 19V4.5C25.5 4 25.7 3.6 26 3.5Z" fill="var(--sc-accent, #FF5500)"/>
        </svg>
      </button>

      <button id="audio-btn" class="top-pill-btn accent-pill" type="button" title="Настройка звука, эквалайзер и натуральный Bass Boost" onclick="window.electronAPI.ui.togglePanel('audio')">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
          <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
        </svg>
        <span>Звук &amp; Bass Boost</span>
      </button>

      <button id="theme-btn" class="top-pill-btn" type="button" title="Кастомные обои, размытие, снег и тема" onclick="window.electronAPI.ui.togglePanel('theme')">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
          <path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
        </svg>
        <span>Обои &amp; Тема</span>
      </button>

      <button id="genius-btn" class="top-pill-btn" type="button" title="Текст песни (Genius Lyrics)" onclick="window.electronAPI.ui.togglePanel('lyrics')">
        <span>Lyrics</span>
      </button>
    </div>

    <!-- Center drag spacer (track panel removed as requested) -->
    <div class="titlebar-drag-spacer"></div>

    <!-- Right: Window Controls -->
    <div id="window-controls">
      <button class="win-btn" id="win-min" title="Свернуть" onclick="window.electronAPI.windowControls.minimize()">&#8211;</button>
      <button class="win-btn" id="win-max" title="Развернуть / В окне" onclick="window.electronAPI.windowControls.maximize()">&#9633;</button>
      <button class="win-btn win-close" id="win-close" title="Закрыть" onclick="window.electronAPI.windowControls.close()">&#10005;</button>
    </div>
  </div>

  <script>
    function syncViewportSize() {
      if (window.electronAPI && window.electronAPI.windowControls && window.electronAPI.windowControls.reportSize) {
        window.electronAPI.windowControls.reportSize(window.innerWidth, window.innerHeight);
      }
    }
    window.addEventListener('resize', syncViewportSize);
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(syncViewportSize);
      ro.observe(document.documentElement);
    }
    setInterval(syncViewportSize, 2500);
    syncViewportSize();

    window.electronAPI.onSettingsUpdated((s) => {
      if (s && s.accentColor) {
        document.documentElement.style.setProperty('--sc-accent', s.accentColor);
      }
    });

    (async () => {
      try {
        const s = await window.electronAPI.controls.getSettings();
        if (s && s.accentColor) {
          document.documentElement.style.setProperty('--sc-accent', s.accentColor);
        }
      } catch (e) {}
    })();
  </script>
</body>

</html>
